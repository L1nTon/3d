<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Viewer — Gipsy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    canvas { display: block; }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
      pointer-events: none;
      z-index: 10;
    }

    #title {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
    }

    #controls-hint {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      text-align: right;
      line-height: 1.6;
    }

    #toolbar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 10px 16px;
    }

    .btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #ccc;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(100,180,255,0.2);
      border-color: rgba(100,180,255,0.5);
      color: #fff;
    }

    .btn.active {
      background: rgba(100,180,255,0.25);
      border-color: rgba(100,180,255,0.6);
      color: #8ccfff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      z-index: 100;
      gap: 20px;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(100, 180, 255, 0.15);
      border-top-color: #64b4ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
    }

    #progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background: #64b4ff;
      border-radius: 2px;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Загрузка модели…</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="canvas-container"></div>

<div id="ui">
  <div id="title">Gipsy</div>
  <div id="controls-hint">
    ЛКМ — вращение &nbsp;|&nbsp; ПКМ / Ctrl+ЛКМ — перемещение<br>
    Колесо — масштаб &nbsp;|&nbsp; Двойной клик — сброс
  </div>
</div>

<div id="toolbar">
  <button class="btn active" id="btn-orbit" onclick="setMode('orbit')">Орбита</button>
  <button class="btn" id="btn-wireframe" onclick="toggleWireframe()">Каркас</button>
  <button class="btn" id="btn-autorotate" onclick="toggleAutoRotate()">Авторотация</button>
  <button class="btn" onclick="resetCamera()">Сброс камеры</button>
  <button class="btn" onclick="toggleFullscreen()">На весь экран</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// --- Scene setup ---
const container = document.getElementById('canvas-container');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.018);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 1.5, 4);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.3;
controls.maxDistance = 50;
controls.autoRotateSpeed = 1.2;

// Double-click to reset
renderer.domElement.addEventListener('dblclick', () => window.resetCamera?.());

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 100;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x4488ff, 0.8);
fillLight.position.set(-5, 2, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffaa44, 0.5);
rimLight.position.set(0, -3, -5);
scene.add(rimLight);

// Ground plane
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x111118,
  roughness: 0.8,
  metalness: 0.1,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid helper
const grid = new THREE.GridHelper(20, 40, 0x1a1a2e, 0x1a1a2e);
grid.material.opacity = 0.5;
grid.material.transparent = true;
scene.add(grid);

// --- Load model ---
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/libs/draco/');

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

let model = null;
let defaultCameraPos = new THREE.Vector3();
let defaultTarget = new THREE.Vector3();
let wireframeOn = false;
let originalMaterials = [];

loader.load(
  'Gipsy.glb',
  (gltf) => {
    model = gltf.scene;
    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
        originalMaterials.push({ mesh: node, mat: node.material });
      }
    });

    // Auto-fit camera
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    model.position.sub(center);
    const bottom = box.min.y - center.y;
    model.position.y -= bottom;

    const maxDim = Math.max(size.x, size.y, size.z);
    const fovRad = camera.fov * (Math.PI / 180);
    let dist = (maxDim / 2) / Math.tan(fovRad / 2);
    dist *= 1.6;

    camera.position.set(0, size.y * 0.5, dist);
    controls.target.set(0, size.y * 0.4, 0);
    controls.update();

    defaultCameraPos.copy(camera.position);
    defaultTarget.copy(controls.target);

    ground.position.y = 0;
    grid.position.y = 0.01;

    scene.add(model);
    hideLoading();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('loading-text').textContent =
        `Загрузка модели… ${Math.round(pct)}%`;
    }
  },
  (err) => {
    document.getElementById('loading-text').textContent = 'Ошибка загрузки: ' + err.message;
    console.error(err);
  }
);

function hideLoading() {
  const el = document.getElementById('loading');
  el.classList.add('hidden');
  setTimeout(() => el.remove(), 600);
}

// --- Expose controls to window ---
window.resetCamera = function () {
  camera.position.copy(defaultCameraPos);
  controls.target.copy(defaultTarget);
  controls.update();
};

window.toggleWireframe = function () {
  wireframeOn = !wireframeOn;
  document.getElementById('btn-wireframe').classList.toggle('active', wireframeOn);
  originalMaterials.forEach(({ mesh }) => {
    if (wireframeOn) {
      mesh.material = new THREE.MeshBasicMaterial({
        color: 0x64b4ff,
        wireframe: true,
      });
    } else {
      mesh.material = originalMaterials.find(m => m.mesh === mesh)?.mat;
    }
  });
};

window.toggleAutoRotate = function () {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btn-autorotate').classList.toggle('active', controls.autoRotate);
};

window.setMode = function (mode) {
  document.querySelectorAll('.btn[id^="btn-"]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode)?.classList.add('active');
};

window.toggleFullscreen = function () {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Render loop ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
